<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlantDoc - Upload Plant Image</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <style>
        :root {
            --green-dark: #2e7d32;
            --green-accent: #43a047;
            --green-shadow: rgba(46, 125, 50, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("{{ url_for('static', filename='_yesdone.png') }}") no-repeat center center;
            background-color: rgba(224, 237, 148, 0.922);
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Splash screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .splash-logo {
            width: 300px;
            animation: splashAnimation 2s ease-in-out forwards;
        }

        @keyframes splashAnimation {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            color: #fff;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s forwards 2.5s; /* Appears after splash screen */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo animation */
        .logo-container img {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Page transition animation */
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-out {
            animation: fadeOut 0.5s forwards;
        }

        /* Loading spinner */
        .loading-spinner {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(76, 175, 80, 0.2);
            border-radius: 50%;
            border-top-color: var(--green-accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            margin-bottom: 25px;
            font-size: 2.5rem;
            text-align: center;
            color: var(--green-dark);
            text-shadow: 0 2px 6px #c8e6c9;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* File upload styling */
        .file-upload-container {
            position: relative;
            margin-bottom: 20px;
        }

        .file-upload-label {
            display: block;
            padding: 15px;
            background-color: #f1f8e9;
            border: 2px dashed #c8e6c9;
            border-radius: 8px;
            text-align: center;
            color: #2e7d32;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background-color: #e8f5e9;
            border-color: #81c784;
        }

        .file-upload-label i {
            font-size: 24px;
            margin-bottom: 10px;
            display: block;
        }

        input[type="file"] {
            position: absolute;
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            z-index: -1;
        }

        .submit-btn {
            background-color: var(--green-accent);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background-color: var(--green-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--green-shadow);
        }

        .submit-btn.ready {
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splash">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="PlantDoc Logo" class="splash-logo">
    </div>

    <div class="container">
        <div class="logo-container" style="text-align: center; margin-bottom: 25px;">
            <img src="{{ url_for('static', filename='logo.png') }}"
                alt="PlantDoc Logo"
                style="max-width: 250px; height: auto;">
        </div>

        <form action="/predict" method="POST" enctype="multipart/form-data" id="upload-form">
            <div class="file-upload-container">
                <label for="file-upload" class="file-upload-label">
                    <i class="fas fa-leaf"></i>
                    <span id="file-label">Select Plant Image</span>
                </label>
                <input id="file-upload" type="file" name="file" accept="image/*" required />
            </div>
            <button type="submit" class="submit-btn">Upload & Predict</button>
            <div class="loading-spinner"></div>
        </form>
    </div>

    <script>
        // Splash screen handling
        document.addEventListener("DOMContentLoaded", function() {
            const splash = document.getElementById('splash');
            
            // Hide splash screen after 2.5 seconds
            setTimeout(function() {
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500);
            }, 2500);
            
            // Form handling
            const form = document.getElementById('upload-form');
            const fileInput = document.getElementById('file-upload');
            const submitBtn = document.querySelector('.submit-btn');
            const loadingSpinner = document.querySelector('.loading-spinner');
            const fileLabel = document.getElementById('file-label');
            
            // Show filename when a file is selected
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const fileName = this.files[0].name;
                    fileLabel.textContent = fileName;
                    submitBtn.classList.add('ready');
                }
            });
            
            // Handle form submission with animation
            form.addEventListener('submit', function(e) {
                // Show loading animation
                loadingSpinner.style.display = 'block';
                
                // Add fade-out animation to container
                document.querySelector('.container').classList.add('fade-out');
            });
        });
    </script>
</body>
</html>
